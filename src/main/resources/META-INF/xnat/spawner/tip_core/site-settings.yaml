####
#### TIP Settings Panels
####

tipSettingsPanel:
    kind: panel.form
    name: tipSettingsPanel
    label: TIP Settings
    url: /xapi/siteConfig
    contentType: json
    contents:
        tipStatusSearchId:
            kind: panel.input.text
            name: tipStatusSearchId
            label: Tip Status Search ID
            description: Enter the ID of the stored search that looks for active image sessions in TIP

#################################################
####  Root Site Admin Spawner Config Object  ####
#################################################

siteSettings:
    kind: tabs
    name: tipCoreAdminPage
    label: TIP Site Settings
    meta:
        tabGroups:
            tipCoreTabGroup: TIP Core
    contains: tabs
    tabs:
        tipCoreTab:
            kind: tab
            name: tipCoreTab
            label: TIP Site Setup
            group: tipCoreTabGroup
            active: true
            contents:
              ${tipSettingsPanel}